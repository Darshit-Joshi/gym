# OneCountry Fitness: full stack (PostgreSQL + API + web).
#
#   cp .env.example .env      # then fill in the secrets
#   docker compose up -d --build
#
# The app is served on http://<host>:${APP_PORT:-8080}. Put HTTPS in front of it
# (a reverse proxy or your host's load balancer) before going live.

name: gym

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gym_db}
    # Reachable only from this machine (for local development and backups), never from outside.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gym_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: gym-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gym_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (openssl rand -hex 32)}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ADMIN_RECOVERY_KEY: ${ADMIN_RECOVERY_KEY:-}
      ALLOW_TRAINER_REGISTRATION: ${ALLOW_TRAINER_REGISTRATION:-true}
      # The web container serves the app and the API from one origin, so CORS only matters
      # if you call the API from another site.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-INR}
      DEFAULT_PHONE_COUNTRY_CODE: ${DEFAULT_PHONE_COUNTRY_CODE:-91}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_MINUTES: ${SCHEDULER_INTERVAL_MINUTES:-60}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      UPLOAD_DIR: /data/uploads
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      DATABASE_SIZE_LIMIT_MB: ${DATABASE_SIZE_LIMIT_MB:-0}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - uploads:/data/uploads

  web:
    build: ./frontend
    image: gym-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  postgres_data:
  uploads:
